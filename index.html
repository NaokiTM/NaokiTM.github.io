<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <!-- google fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace+SC&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Monomaniac+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=Quintessential&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap" rel="stylesheet">

    <title>Naoki Miyagawa</title>
</head>
<body>
    <div class="background-gradient"></div>
    <nav id="top-bar">
        <div id="top-bar-flex">
            <div id="top-bar-left">
                <a class="contact-button" href="https://github.com/NaokiTM" aria-label="GitHub">
                    <img src="/projectimages/github.png" alt="">
                </a>

                <a class="contact-button" href="https://www.linkedin.com/" aria-label="LinkedIn">
                    <img src="/projectimages/linkedin.png" alt="">
                </a>

                <a class="contact-button" href="mailto:your@email.com" aria-label="Email">
                    <img src="/projectimages/email.png" alt="">
                </a>
            </div>

            <div id="top-bar-right">
                <a href="CV.pdf" id="resume-button">Open CV</a>
            </div>
        </div>
    </nav>


    <div id="scroll-spacer">
        <div id="page-wrapper">
            <section id="main-container">

                <!-- needed to center the center box and move the projects arrow down -->
                <div style="flex: 1"></div>

                <div id="center-box">
                    <!-- title -->
                    <div id="name-container">
                        <div id="first-name">Naoki</div>
                        <div id="last-name">Miyagawa</div>
                    </div>

                    <!-- Description -->
                    <p id="description">
                        Computer science & AI graduate from Aberystwyth University,
                        currently based in <b>Bristol, UK.</b>
                        I like to make interesting mobile + web apps with emphasis on UI/UX.
                        In my free time, I enjoy calligraphy, various forms of fitness, and playing guitar.
                    </p>
                </div>

                <button id="projects-arrow">
                    <span class="projects-label">Projects</span>
                    <span class="arrow">↓</span>
                </button>
            </section>


            <!-- projects loaded in from js at runtime -->
            <section id="projects">
            </section>

<!-- project card loads before the scroll script applies -->
<script src="projectcard.js"></script>
<script src="script.js"></script>

</body>
</html>
